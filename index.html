<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DNK Tech &amp; Studios</title>
<meta name="description" content="Games by DNK Tech &amp; Studios.">
<!-- Self-contained on purpose: no fonts, scripts or images from other sites. -->
<style>
  :root {
    --bg: #faf9f6; --ink: #1b1d24; --dim: #5a6070; --line: #dcdde3; --accent: #007d8f; --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0e1a; --ink: #f5f7fa; --dim: #a3a9ba; --line: #2a3355; --accent: #00e5ff; --card: #151a2e; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 48px 16px 64px;
  }
  main { max-width: 720px; margin: 0 auto; display: grid; gap: 28px; }
  h1 { font-size: 30px; line-height: 1.2; margin: 0; letter-spacing: .01em; }
  .lede { color: var(--dim); margin: 6px 0 0; }
  .game { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 8px; }
  .game h2 { margin: 0; font-size: 20px; }
  .game p { margin: 0; }
  .links { display: flex; gap: 16px; flex-wrap: wrap; }
  a { color: var(--accent); }
  footer { color: var(--dim); font-size: 14px; border-top: 1px solid var(--line); padding-top: 16px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>DNK Tech &amp; Studios</h1>
    <p class="lede">Small games for short sessions.</p>
  </header>

  <section class="game">
    <h2>Skygun: Endless Sky Shooter</h2>
    <p>One finger, no fire button. Drag to fly through an endless sky while the game shoots for you. Coming to Google Play.</p>
    <div class="links">
      <a href="skygun/privacy-policy.html">Privacy policy</a>
      <a href="skygun/privacy-policy.html#id">Kebijakan privasi</a>
    </div>
  </section>

  <footer>
    Contact: ilhamraksa.2805@gmail.com
  </footer>
</main>
</body>
</html>
